<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }

	}

	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

	pointer-events: none;
	}
.leaflet-top {
	top: 0;

.leaflet-right {
	right: 0;

.leaflet-bottom {
	bottom: 0;

.leaflet-left {

.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

.leaflet-zoom-animated {

}

.leaflet-zoom-anim .leaflet-zoom-animated {

.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {

.leaflet-interactive {

/* visual tweaks */

.leaflet-container {

/* general toolbar styles */

.leaflet-bar {

.leaflet-bar a {

.leaflet-control-layers {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,

.leaflet-touch .leaflet-bar {

.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;

.leaflet-popup-content {

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

	}

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

/* div icon */

.leaflet-div-icon {
	background: #fff;

	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}

<style>:root{--ink:#0b2545;--bg:#eef2f8;--card:#fff;--mute:#5a6b85;--line:#d9e1ee;--gold:#c8921a;--on:#fff;--ok:#16794f;--off:#8a6d1c}
@media(prefers-color-scheme:dark){:root{--ink:#e8eefb;--bg:#0b1424;--card:#13203a;--mute:#9bb0d0;--line:#243656;--ok:#4fd1a0;--off:#e6c066}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:grid;grid-template-columns:410px 1fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top map" "sheet map";flex:1;min-height:0}
#top{grid-area:top;background:#0b2545;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;background-image:radial-gradient(circle at 100% 0,rgba(200,146,26,.35),transparent 55%)}
#map{grid-area:map;position:relative;z-index:0;min-height:0}
#sheet{grid-area:sheet;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line)}
#view{flex:1;overflow:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
#grip{display:none}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:40px;height:40px;border-radius:12px;background:var(--gold);color:#0b2545;display:grid;place-items:center;font-size:1.6rem;font-weight:800;flex:none}
h1{margin:0;font-size:1.2rem}
.brand p{margin:1px 0 0;font-size:.78rem;opacity:.85}
.menu{display:flex;gap:7px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.menu::-webkit-scrollbar{display:none}
.pill{flex:none;font:inherit;font-size:.85rem;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.pill.live i{box-shadow:0 0 0 2px #4fd1a0}
.pill.gps{background:var(--gold);border-color:var(--gold);color:#241800;font-weight:700}
.pill.on{background:#fff;color:#0b2545;font-weight:700}
.priv{font-size:.75rem;margin:8px 0 0;opacity:.85}
.fl{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.fchip,#ap{font:inherit;font-size:.8rem;padding:6px 11px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer;align-items:center}
.card:hover,.card:focus{box-shadow:0 6px 16px rgba(11,37,69,.14);outline:none}
.th{width:84px;height:68px;border-radius:10px;background-size:cover;background-position:center;flex:none;background-color:var(--line)}
.card b{display:block;font-size:.98rem}
.meta{font-size:.8rem;color:var(--mute);margin-top:2px}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff}
.st{font-size:.78rem;font-weight:700}
.st.on{color:var(--ok)}.st.off{color:var(--off)}
h2.sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 4px 8px}
.sv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.88rem}
.sv b{display:block}.sv span{color:var(--mute);font-size:.82rem}
.tagon{font-size:.68rem;background:#16794f;color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.foot{font-size:.75rem;color:var(--mute);margin:18px 4px 4px;line-height:1.6}
a{color:inherit}
.dnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.link{background:none;border:0;padding:0;font:inherit;font-size:.85rem;color:var(--mute);text-decoration:underline;cursor:pointer}

.card2 input[type=file]{font:inherit;font-size:.85rem}
.seg{display:flex;gap:6px}.seg button{flex:1;font:inherit;font-size:.85rem;padding:9px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:#b3261e;color:#fff;border-color:#b3261e;font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.th2{position:relative;width:84px;height:84px}
.th2 img{width:100%;height:100%;object-fit:cover;border-radius:12px}.th2 button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#b3261e;color:#fff;cursor:pointer}
#rp-err{color:#b3261e;font-weight:700}
.ok2{border-top:5px solid #16794f}.ok2 textarea{font-size:.85rem}
#rpres{margin-top:12px}#rpform[hidden]{display:none}
@media(min-width:760px){.launch{grid-template-columns:repeat(8,1fr)}}

/* ===== v5.2 ===== */
.cr{margin:34px 0 8px;padding:14px 12px;text-align:center;font-size:.8rem;color:var(--mute);border-top:1px dashed var(--line)}
.cr b{color:var(--ink)}.cr a{color:inherit}
.where{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:14px 0;font-size:.88rem;line-height:1.55}
.where summary{cursor:pointer;font-weight:700;padding:12px 0}.where p{margin:0 0 12px}
.gds{display:grid;gap:10px}
.gd{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.gd>i{font-style:normal;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--bg);flex:none}
.gd div{flex:1;min-width:0}.gd b{display:block;font-size:.92rem}.gd p{margin:2px 0 0;font-size:.8rem;color:var(--mute)}
.gd .btn{flex:none;padding:9px 12px;font-size:.8rem}
.tels{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.tel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:12px}
.tel>i{font-style:normal;font-size:1.5rem}.tel div{flex:1;min-width:120px}.tel b{display:block;font-size:.9rem}.tel small{color:var(--mute);font-size:.76rem}
.tel .btn{flex:none;padding:9px 12px;font-size:.82rem}
.portal2{display:flex;flex-wrap:wrap;gap:10px}
.pt2{display:inline-flex;gap:8px;align-items:center;padding:11px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:.88rem}
.apgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))!important;gap:14px!important}
.apph{height:150px!important;margin:-14px -14px 6px!important;border-radius:18px 18px 0 0}
.apc b{font-size:.98rem}
@media(max-width:520px){.apgrid{grid-template-columns:repeat(2,1fr)!important;gap:10px!important}.apph{height:120px!important}.gd{flex-wrap:wrap}.gd .btn{width:100%}}

/* ===== GIAO DIỆN BẢN ĐỒ VIỆT NAM (v5.7): đỏ cờ – vàng sao – sen hồng – lúa xanh ===== */
:root{--gold:#e9a400;--vr:#d7261e;--vy:#ffcd1f}
#top{background:linear-gradient(160deg,#7d0d12,#c8201e 62%,#ee5a24);background-image:radial-gradient(circle at 100% 0,rgba(255,205,31,.5),transparent 52%),linear-gradient(160deg,#7d0d12,#c8201e 62%,#ee5a24)}
.logo{background:var(--vr);color:var(--vy);font-size:0;box-shadow:0 0 0 3px var(--vy),0 0 18px rgba(255,205,31,.8)}.logo:after{content:"★";font-size:1.6rem}
.pill.gps,.btn.go{background:linear-gradient(135deg,#ffe27a,#ffb300);border-color:#ffb300;color:#4a2600}
.pill.on,.pill.on#tour{background:#fff;color:#8f1015}
.pill i{width:25px;height:25px;display:grid;place-items:center;font-style:normal;font-size:14px;background:#fff;box-shadow:0 0 0 2px var(--c),0 0 12px var(--c)}
.pill.live i{box-shadow:0 0 0 2px #4fd1a0,0 0 12px #4fd1a0}
#map{box-shadow:inset 0 0 0 3px var(--vy),inset 0 0 0 6px var(--vr)}
#map .leaflet-tile-pane{filter:sepia(.38) saturate(1.35) hue-rotate(-10deg) brightness(1.03)}
#map:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:500;background:radial-gradient(ellipse at center,transparent 60%,rgba(215,38,30,.14))}
.pin{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 45%),var(--c);box-shadow:0 0 0 2px var(--c),0 4px 12px rgba(0,0,0,.4),0 0 18px var(--c)}
.pin i{font-size:19px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.lbl{background:#fff;color:#7d0d12;border:1.5px solid var(--vy);box-shadow:0 2px 6px rgba(0,0,0,.3)}
#nav{background:linear-gradient(#fff,#fff7e0);border-bottom:3px solid var(--vy)}
#nav button span{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;font-size:1.15rem;background:linear-gradient(135deg,#ffe27a,#ffb300);box-shadow:0 0 12px rgba(255,180,0,.75)}
#nav button:nth-child(2) span{background:linear-gradient(135deg,#7be0a4,#1c8a68);box-shadow:0 0 12px rgba(40,190,120,.7)}
#nav button:nth-child(3) span{background:linear-gradient(135deg,#ffb3cf,#e8588c);box-shadow:0 0 12px rgba(232,88,140,.7)}
#nav button:nth-child(4) span{background:linear-gradient(135deg,#ff9a8a,#d7261e);box-shadow:0 0 12px rgba(215,38,30,.7)}
#nav button:nth-child(5) span{background:linear-gradient(135deg,#8fd0ff,#1f6fb2);box-shadow:0 0 12px rgba(40,140,230,.7)}
#nav button.on{background:linear-gradient(135deg,#d7261e,#8f1015);color:#fff}
.hero2{background:linear-gradient(165deg,#7d0d12 0%,#c8201e 52%,#f08a24 100%)}
.ph2{background:linear-gradient(150deg,#7d0d12,#c8201e)}
.tile .ti,.sc.k i{filter:drop-shadow(0 0 6px var(--c))}
.tile .ti{box-shadow:0 0 16px var(--c)}
.card .th{box-shadow:0 0 0 2px var(--vy)}
.hub{display:block;width:100%;aspect-ratio:16/8;max-height:380px;border:0;border-radius:24px;overflow:hidden;position:relative;color:#fff;text-align:left;cursor:pointer;padding:0;font:inherit;background-size:cover;background-position:center;background-color:#7d0d12;box-shadow:0 0 0 3px var(--vy),0 14px 34px rgba(125,13,18,.35)}
.hub:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(80,5,8,.9))}
.hub>*{position:absolute;left:18px;right:18px;z-index:1}
.hub .hb{top:16px;right:auto;background:var(--vy);color:#5a0a0d;font-weight:800;font-size:.78rem;padding:4px 12px;border-radius:12px}
.hub b{bottom:44px;font-size:clamp(1.25rem,4.5vw,2rem)}.hub small{bottom:16px;font-size:.84rem}
/* ---- v5.9: chữ rõ hơn, thẻ ấp, robot ---- */
:root{--mute:#33435f;--line:#bccae0}
@media(prefers-color-scheme:dark){:root{--ink:#fff;--mute:#dbe5f8;--line:#46609a;--card:#16264a}.apc .ok{color:#6ee7b0}.apc .pd{color:#ffd166}}
.apc b{font-size:1.02rem;font-weight:800}.apc small{font-size:.82rem;font-weight:600}.apc u{font-size:.8rem;font-weight:800}
.apc .ok{color:#0a6b43}.apc .pd{color:#8a5a00}
.apph{width:100%;height:auto;aspect-ratio:4/3;border-radius:12px;background-size:cover;background-position:center}
#nav button{color:#4a1215;font-weight:800}#nav button.on{color:#fff}
.ph2 p,.hero2 p{opacity:1;font-weight:500}.pc .t small,.tile small,.meta{color:var(--mute)}
#rb{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);z-index:30;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
@media(min-width:801px){#rb{left:24px;right:auto;max-width:430px;bottom:24px}}
#rb>*{pointer-events:auto}
.rbot{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 30% 25%,#fff3b0,#ffcd1f 55%,#e9a400);box-shadow:0 0 0 3px #fff,0 0 22px rgba(255,205,31,.95),0 6px 14px rgba(0,0,0,.35);animation:rbob 2.2s ease-in-out infinite}
@keyframes rbob{50%{transform:translateY(-6px)}}
.rbub{position:relative;background:#fff;color:#4a1215;border:2px solid #ffcd1f;border-radius:20px 20px 20px 6px;padding:11px 36px 12px 14px;font-size:.95rem;line-height:1.45;font-weight:700;box-shadow:0 8px 24px rgba(125,13,18,.4);transform-origin:0 100%;animation:rpop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes rpop{from{transform:scale(.4);opacity:0}}
.rbub:before{content:"";position:absolute;left:-11px;bottom:12px;border:7px solid transparent;border-left:0;border-right:10px solid #ffcd1f}
.rbub small{display:block;font-size:.72rem;color:#d7261e;font-weight:800;margin-bottom:2px}
.rbub .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:1.1rem;color:#7d0d12;cursor:pointer}
.rbg{margin-top:8px;padding:8px 14px;border-radius:12px;border:0;background:linear-gradient(135deg,#d7261e,#8f1015);color:#fff;font:inherit;font-size:.85rem;font-weight:800;cursor:pointer}
@media(prefers-reduced-motion:reduce){.rbot,.rbub{animation:none}}
/* ---- v5.13: bé robot (Robo Buddy) làm ảnh đại diện bong bóng chào ---- */

.cbh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,#7d0d12,#d7261e);color:#fff;border-radius:18px 18px 0 0}
.cba{flex:none;width:46px;height:46px;border-radius:50%;background:#fff var(--m) center/cover;box-shadow:0 0 0 2px #ffcd1f}
.cbh b{display:block;font-size:1.02rem}.cbh small{font-size:.78rem}
.cbx{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.cbm{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.cm{max-width:90%;display:flex;flex-direction:column;gap:6px}.cm.u{align-self:flex-end}
.cmt{padding:10px 13px;border-radius:16px;line-height:1.5;font-size:.95rem;font-weight:600;word-break:break-word}
.cm.b .cmt{background:#fff3cf;color:#3b1013;border:1.5px solid #ffcd1f;border-bottom-left-radius:5px}
.cm.u .cmt{background:linear-gradient(135deg,#d7261e,#9d1117);color:#fff;border-bottom-right-radius:5px}
.cmb{display:flex;flex-wrap:wrap;gap:6px}
.cbb{border:0;border-radius:12px;padding:9px 13px;font-family:inherit;font-weight:800;font-size:.85rem;line-height:1.2;background:#1f6fb2;color:#fff;text-decoration:none;cursor:pointer}
.cbb:nth-child(2n){background:#1c8a68}.cbb:nth-child(3n){background:#d7261e}
.cbq{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px}
.cbq button{flex:none;border:1.5px solid #ffcd1f;background:#fff;color:#7d0d12;border-radius:16px;padding:8px 12px;font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer}
.cbi{display:flex;gap:8px;padding:6px 12px 4px}
.cbi input{flex:1;min-width:0;border:2px solid #ffcd1f;border-radius:16px;padding:11px 14px;font-size:16px;background:#fff;color:#3b1013}
.cbi button{border:0;border-radius:16px;padding:0 18px;font-size:1.2rem;background:linear-gradient(135deg,#d7261e,#8f1015);color:#fff;cursor:pointer}
.cbn{font-size:.72rem;padding:2px 14px 8px;color:#5b4a4c;text-align:center}
.cdot span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#d7261e;animation:cdt 1s infinite}
.cdot span:nth-child(2){animation-delay:.15s}.cdot span:nth-child(3){animation-delay:.3s}
@keyframes cdt{50%{transform:translateY(-5px);opacity:.4}}
.cbv{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;width:42px;height:36px;border-radius:18px;font-size:1.15rem;cursor:pointer}
.cbh .cbx{margin-left:6px}
.cmb .cbb.l{background:#fff;color:#7d0d12;border:1.5px solid #ffcd1f}
#cbmic{background:linear-gradient(135deg,#1c8a68,#0f5c45)!important}
#cbmic.rec{background:#d7261e!important;animation:rbob 1s ease-in-out infinite}

  if(typeof d.gioText==="string"&&d.gioText)L.push("🕒 "+d.gioText);if(lh.sdt)L.push("📞 "+lh.sdt);if(d.luuY)L.push("💡 "+d.luuY);
  if(!hasXY(d)&&d.loai!=="ap")L.push("(Điểm này chưa có toạ độ nên chưa hiện trên bản đồ.)");
  const b=[{l:"🗺️ Xem trên bản đồ",f:()=>goMap({id:d.id})}],u=dirU(d);if(u)b.push({l:"🧭 Dẫn đường",href:u});if(lh.sdt)b.push({l:"📞 Gọi",href:"tel:"+lh.sdt});return T(L.join("\n"),b)}
function grpA(k){if(k==="ap")return T("Xã có "+D.ap.length+" ấp. Chạm vào ấp để xem ảnh văn phòng ấp và dẫn đường.",[{l:"🏘️ Xem các ấp",f:()=>showPage("cac-ap")}]);
  const L=ALL.filter(d=>D.loai[d.loai]&&D.loai[d.loai].nhom===k),g=D.nhom[k]||{};
  if(!L.length)return T("Chưa có địa điểm nào trong nhóm này.");
  const b=L.slice(0,5).map(d=>({l:(d.ngan||d.ten),f:()=>goMap({id:d.id})}));b.push({l:"🗺️ Xem tất cả",f:()=>goMap({grp:k})});
  return T((g.icon||"📍")+" "+(g.ten||"Địa điểm")+": có "+L.length+" nơi. Chạm vào tên để xem chi tiết và dẫn đường:",b)}
function phones(){const L=ALL.filter(d=>d.lienHe&&d.lienHe.sdt).slice(0,6).map(d=>"📞 "+(d.ngan||d.ten)+": "+d.lienHe.sdt);
  return T("🚨 Khẩn cấp (cả nước): Công an 113 · Cứu hỏa 114 · Cấp cứu 115\n👶 Bảo vệ trẻ em: "+D.hotlineTreEm+(L.length?"\n\n"+L.join("\n"):"")+"\n\nMột số nơi chưa có số điện thoại trong dữ liệu.",[{l:"📞 Gọi 113",href:"tel:113"},{l:"📞 Gọi 114",href:"tel:114"},{l:"📞 Gọi 115",href:"tel:115"}])}
function actGo(s){const p=s.split(":");if(p[0]==="id")goMap({id:p[1]});else if(p[0]==="grp")goMap({grp:p[1]});else showPage(p[1])}
function answer(q){const n=nzc(q),raw=q.toLowerCase();
  if(!n)return T("Bạn nhập câu hỏi giúp mình nhé 😊");
  if(/^(xin chao|chao|hello|hi|alo)( |$)/.test(n)&&n.split(" ").length<=4)return T("Chào bạn! 😊 Bạn cần tìm gì ở xã Vĩnh Gia? Chạm vào gợi ý bên dưới hoặc gõ câu hỏi nhé.");
  if(/cam on|thanks|tot qua/.test(n))return T("Không có gì ạ! Cần gì cứ hỏi mình nhé 💛");
  if(/gan toi|gan nhat|gan day|quanh day|o gan/.test(n))return T("Bấm nút dưới để mình tìm các điểm gần vị trí của bạn (cần cho phép định vị).",[{l:"📍 Tìm gần tôi",f:()=>{goMap({});setTimeout(()=>$("near").click(),400)}}]);
  let pl=null;for(const a of ALIAS){if(a[0].test(n)){pl=byId(a[1]);break}}pl=pl||findPlace(n);if(pl)return placeA(pl);
  if(/khan cap|cap cuu|hoa hoan|dien thoai|hotline|duong day nong|sdt/.test(n))return phones();
  if(/bao cao|phan anh|rac|o nhiem|khoi bui|mui hoi|nuoc thai|diem den|dot rom/.test(n)){const h=D.huongDan.find(x=>x.act==="page:bao-cao");if(h)return T(h.ic+" "+h.cau+"\n"+h.goiY,[{l:h.nut,f:()=>actGo(h.act)}])}
  if(/tuyen sinh|chuyen truong|hoc ba|van bang|chung chi/.test(n))return T("🎓 Thủ tục học đường:\n"+D.dichVu.map(x=>"• "+x.ten+" – "+x.mota).join("\n"),[{l:"🧾 Trang Dịch vụ",f:()=>showPage("dich-vu")}]);
  if(/giay to|thu tuc|khai sinh|khai tu|ket hon|cu tru|tam tru|thuong tru|ly lich|can cuoc|cccd|vneid|ho chieu|bang lai|dich vu cong|dvc/.test(n))return T("🧾 Nhiều thủ tục làm được trực tuyến:\n"+D.dvc.slice(0,6).map(x=>x.icon+" "+x.ten+" – "+x.mota).join("\n")+"\n\n"+D.dvcGhiChu+" Cần hỗ trợ trực tiếp thì bạn đến UBND xã.",[{l:"🌐 Cổng dịch vụ công",href:D.dvcLink},{l:"🏛️ Xem UBND xã",f:()=>goMap({id:"ubnd-xa"})},{l:"🧾 Trang Dịch vụ",f:()=>showPage("dich-vu")}]);
  if(/gio hoc|hoc may gio|tan hoc|ra choi/.test(n))return T("🕒 Giờ học:\n"+Object.keys(D.gio).map(k=>{const g=D.gio[k];return g.ten+": sáng "+g.sang.join("–")+", chiều "+g.chieu.join("–")+"\n   Ra chơi: "+g.nghi}).join("\n"));
  for(const g of GRP){const ok=g[0]==="cho"?(/chợ|mua bán|mua sắm/.test(raw)):g[1].test(n);if(ok)return grpA(g[0])}
  return T("Mình chưa tìm thấy thông tin phù hợp với câu này 🙏 Bạn thử hỏi cụ thể hơn (ví dụ: “Trạm y tế ở đâu?”, “Ấp Cà Na”, “Làm giấy tờ ở đâu?”) hoặc liên hệ trực tiếp UBND xã: "+X.truSoUBND+".",[{l:"🏛️ Xem UBND xã",f:()=>goMap({id:"ubnd-xa"})},{l:"🌐 Cổng thông tin xã",href:X.web}])}
function say(w,o){const box=$("cbm"),m=document.createElement("div");m.className="cm "+w;const t=document.createElement("div");t.className="cmt";t.innerHTML=esc(o.t).replace(/\n/g,"<br>");m.appendChild(t);
  if((o.b&&o.b.length)||(w==="b"&&SS)){const bx=document.createElement("div");bx.className="cmb";(o.b||[]).forEach(b=>{const e=document.createElement(b.href?"a":"button");e.className="cbb";e.textContent=b.l;
    if(b.href){e.href=/^tel:\+?\d+$/.test(b.href)?b.href:safeUrl(b.href);if(e.href.indexOf("tel:")!==0){e.target="_blank";e.rel="noopener noreferrer"}}
    else e.onclick=()=>{closeChat();try{b.f()}catch(x){toast("Không mở được, bạn thử lại nhé")}};bx.appendChild(e)});if(w==="b"&&SS){const l=document.createElement("button");l.className="cbb l";l.textContent="🔊 Nghe";l.onclick=()=>speak(o.t);bx.appendChild(l)}m.appendChild(bx)}
  box.appendChild(m);box.scrollTop=box.scrollHeight}
function ask(q,lab,voice){q=q.trim().slice(0,120);if(!q)return;if(SS&&autoRead&&!voice)unlockTTS();say("u",{t:lab||q});const box=$("cbm"),m=document.createElement("div");m.className="cm b";m.innerHTML='<div class="cmt cdot"><span></span><span></span><span></span></div>';box.appendChild(m);box.scrollTop=box.scrollHeight;setTimeout(()=>{m.remove();const a=answer(q);say("b",a);if(SS&&(autoRead||voice))speak(a.t)},450)}
function send(){const i=$("cbi"),v=i.value;i.value="";ask(v)}
function openChat(){chatOpen=true;cb.hidden=false;rb.hidden=true;cfUpd();if(!cb.dataset.i){cb.dataset.i="1";say("b",T("Chào bạn! 👋 Mình là Bot dẫn đường, trợ lý bản đồ số của xã Vĩnh Gia.\nBạn có thể hỏi mình về địa điểm (ấp, trường học, trạm y tế…), số điện thoại, làm giấy tờ ở đâu, phản ánh rác thải…"))}if(!matchMedia("(pointer:coarse)").matches)$("cbi").focus()}
function closeChat(){chatOpen=false;if(SS)SS.cancel();if(rec)rec.stop();cb.hidden=true;rbShow(page==="tong-quan");cfUpd()}
/* ---- giọng nói: bé bot đọc to câu trả lời + nghe người dân nói ---- */
const SS=window.speechSynthesis||null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;let autoRead=false,rec=null;
if(!SS)$("cbv").hidden=true;if(!SR)$("cbmic").hidden=true;
function spoken(s){return String(s).replace(/TH&THCS/g,"Tiểu học và Trung học cơ sở").replace(/THCS/g,"Trung học cơ sở").replace(/UBND/g,"Ủy ban nhân dân").replace(/(\d)\s*–\s*(\d)/g,"$1 đến $2").replace(/&/g," và ").replace(/\d{3,}/g,m=>m.split("").join(" ")).replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\u2139\uFE0F•·“”]/gu," ").replace(/[–—]/g,", ").replace(/\s*\n+\s*/g,". ").replace(/\s+/g," ").trim()}
function unlockTTS(){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;SS.speak(u)}catch(x){}}
function speak(s){if(!SS)return;SS.cancel();const u=new SpeechSynthesisUtterance(spoken(s));u.lang="vi-VN";const v=SS.getVoices().filter(x=>/^vi/i.test(x.lang))[0];if(v)u.voice=v;u.rate=.95;SS.speak(u)}
function toggleRead(){autoRead=!autoRead;const v=$("cbv");v.textContent=autoRead?"🔊":"🔇";v.setAttribute("aria-pressed",String(autoRead));if(autoRead)speak("Mình sẽ đọc câu trả lời cho bạn nghe nhé");else SS.cancel()}
function mic(){if(!SR)return;if(rec){rec.stop();return}
  const mb=$("cbmic");if(SS){SS.cancel();unlockTTS()}rec=new SR();rec.lang="vi-VN";rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>mb.classList.add("rec");
  rec.onresult=e=>{const v=e.results[0][0].transcript;if(v)ask(v,v,true)};
  rec.onerror=e=>toast(e.error==="not-allowed"?"Bạn cần cho phép trình duyệt dùng micro":"Chưa nghe rõ, bạn thử lại nhé");
  rec.onend=()=>{mb.classList.remove("rec");rec=null};
  try{rec.start()}catch(x){rec=null}}
cf.addEventListener("click",openChat);
cb.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.classList.contains("cbx"))closeChat();else if(b.id==="cbs")send();else if(b.id==="cbmic")mic();else if(b.id==="cbv")toggleRead();else if(b.dataset.i!==undefined)ask(QK[b.dataset.i][1],QK[b.dataset.i][0])});
$("cbi").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&chatOpen)closeChat()});
/* ---------- khởi động ---------- */
renderTongQuan();renderAp();renderBaoCao();renderDv();
list();
const h0=decodeURIComponent(location.hash.slice(1));
const start=h0&&byId(h0)?"ban-do":"tong-quan";
showPage(start);
if(h0&&byId(h0))open(h0);
window.addEventListener("hashchange",()=>{const x=decodeURIComponent(location.hash.slice(1));
  if(PAGES[x]&&x!==page)showPage(x);else if(byId(x)&&x!==sel){showPage("ban-do");open(x)}});
})();
</script>
